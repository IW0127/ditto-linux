[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ditto-linux"
version = "1.3.1"
description = "Ditto clipboard manager for Linux (compatible with Ditto's database format)"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.4"]

[project.scripts]
ditto-linux = "ditto_linux.cli:main"

[tool.setuptools.packages.find]
include = ["ditto_linux*"]
